name: Android CI

on:
  push:
  repository_dispatch:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@main

      - name: Setup JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '21'
          java-package: jdk
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAB
        run: ./gradlew :androidApp:bundleRelease

      - name: Generate four signed ABI APKs from AAB
        shell: bash
        run: |
          bash .github/scripts/build-abi-apks.sh androidApp KMM

      - name: Upload arm64-v8a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/KMM-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/KMM-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/KMM-x86.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/KMM-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload retrace mapping without ZIP wrapping
        if: ${{ hashFiles('ci-output/abi-apks/KMM-mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/KMM-mapping.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 3
          keep_minimum_runs: 2
